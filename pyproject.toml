[project]
name = "veneto-city-data-api"
version = "0.1.0"
description = "A typed FastAPI service for demographic and income data about Veneto's largest cities."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Alan Viana" }]
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.52.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "respx>=0.22.0",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]

[tool.hatch.build.targets.wheel]
packages = ["src/veneto_city_data"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ty.src]
include = ["src", "tests"]
